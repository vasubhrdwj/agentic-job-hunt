name: job-hunt

x-backend-environment: &backend-environment
  DATABASE_URL: postgresql+psycopg://job_hunt:job_hunt@postgres:5432/job_hunt
  ENVIRONMENT: development
  ENABLE_PRACTICAL_MODE: "${ENABLE_PRACTICAL_MODE:-1}"
  ENABLE_TRACING: "0"
  USE_MOCKS: "${USE_MOCKS:-1}"
  GOOGLE_API_KEY: "${GOOGLE_API_KEY:-}"
  SERPAPI_API_KEY: "${SERPAPI_API_KEY:-}"
  PHOENIX_API_KEY: "${PHOENIX_API_KEY:-}"
  PHOENIX_COLLECTOR_ENDPOINT: "${PHOENIX_COLLECTOR_ENDPOINT:-}"
  JOB_HUNT_DATA_KEYS: "${JOB_HUNT_DATA_KEYS:-}"
  JOB_HUNT_OWNER_ID: "${JOB_HUNT_OWNER_ID:-owner}"
  JOB_HUNT_OWNER_TOKEN_HASH: "${JOB_HUNT_OWNER_TOKEN_HASH:-}"
  JOB_HUNT_PRIVACY_RECEIPT_SECRET: "${JOB_HUNT_PRIVACY_RECEIPT_SECRET:-}"
  LEGACY_HUNT_API_MODE: "${LEGACY_HUNT_API_MODE:-read_only}"
  ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: job_hunt
      POSTGRES_USER: job_hunt
      POSTGRES_PASSWORD: job_hunt
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U job_hunt -d job_hunt"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    build: .
    command: ["python", "-m", "alembic", "upgrade", "head"]
    environment: *backend-environment
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build: .
    restart: unless-stopped
    command:
      [
        "uvicorn",
        "job_hunt_agent.api:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
      ]
    environment: *backend-environment
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    stop_grace_period: 30s

  worker:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "job_hunt_agent.worker"]
    environment: *backend-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 30s

  frontend:
    image: node:20-alpine
    working_dir: /app
    command: ["sh", "-c", "npm ci && npm run dev -- --hostname 0.0.0.0"]
    environment:
      API_BASE_URL: http://web:8000
      JOB_HUNT_SESSION_COOKIE: job_hunt_session
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      web:
        condition: service_healthy

volumes:
  postgres_data:
  frontend_node_modules:
