services:
  - type: web
    name: job-hunt-agent
    runtime: docker
    plan: free
    region: singapore
    # Web traffic is safe once Postgres is reachable and migrated. Full `/ready`
    # separately reports whether provider jobs also have a compatible worker.
    healthCheckPath: /web-ready
    # Do not deploy a commit until the linked branch's required CI checks pass.
    autoDeployTrigger: checksPass
    envVars:
      - key: ENVIRONMENT
        value: production
      # Fresh deployments use owner-scoped email/password accounts directly.
      # Set the recovery flag and the legacy owner values manually only while
      # migrating an older single-owner database; they are not normal login
      # credentials and should not be part of a reusable blueprint.
      - key: ENABLE_PRACTICAL_MODE
        value: "1"
      - key: JOB_HUNT_LEGACY_RECOVERY_REQUIRED
        value: "0"
      # Normal email/password signup is available immediately on a fresh
      # database. Legacy recovery, when explicitly enabled, temporarily
      # suppresses signup until that one workspace is attached to an account.
      - key: JOB_HUNT_SIGNUP_MODE
        value: open
      # Free-tier bridge: the web process also runs one durable interactive
      # queue thread while the service is awake. Contact discovery is enabled
      # only when the provider safeguards below are fully configured; legacy
      # jobs are never claimed. Interrupted leases recover on the next wake.
      - key: ENABLE_EMBEDDED_SCAN_WORKER
        value: "1"
      - key: JOB_HUNT_WORKER_KINDS
        value: scan_saved_search,discover_contacts
      - key: JOB_HUNT_EMBEDDED_WORKER_ID
        value: render-embedded-scan
      - key: USE_MOCKS
        value: "0"
      # Compatibility history remains readable/deletable during migration,
      # but production cannot create or mutate legacy hunts.
      - key: LEGACY_HUNT_API_MODE
        value: read_only
      - key: LEGACY_HUNT_API_SUNSET
        value: "Thu, 31 Dec 2026 23:59:59 GMT"
      - key: DATABASE_URL
        sync: false
      # The single hosted web instance upgrades the configured database before
      # accepting traffic. A failed migration exits the container.
      - key: MIGRATE_ON_START
        value: "1"
      - key: JOB_HUNT_PRIVACY_RECEIPT_SECRET
        sync: false
      - key: ENABLE_TRACING
        value: "1"
      - key: ENABLE_TRACE_DRAFT_CONTENT
        value: "0"
      # Production resume processing must use paid Gemini API quota. Set this
      # manually to 1 only after confirming the configured Google API key is
      # on paid Gemini quota; abuse-monitoring retention still applies.
      - key: GEMINI_PAID_SERVICE_ACK
        sync: false
      # Health checks and normal traffic trigger expired-data cleanup at this
      # interval so long-lived services do not retain runs indefinitely.
      - key: RETENTION_CLEANUP_INTERVAL_SECONDS
        value: "3600"
      # Comma-separated key-id:Fernet-key entries. The first key encrypts new
      # requests, results, and outcomes; keep older keys during rotation.
      - key: JOB_HUNT_DATA_KEYS
        sync: false
      - key: PHOENIX_QUERY_TRANSPORT
        value: rest
      - key: PHOENIX_QUERY_LOOKBACK_HOURS
        value: "720"
      # Phoenix Cloud regularly exceeds the 1.5s default on long lookbacks,
      # and one timeout disables self-RAG for the whole run (exemplar cache).
      - key: PHOENIX_QUERY_TIMEOUT_S
        value: "15"
      # Retrieval reads newest spans first; a small window lets fresh runs
      # bury the curated seed exemplars. 1000 x 3 pages keeps ~3000 spans
      # (~100 runs) in reach.
      - key: PHOENIX_QUERY_SPAN_LIMIT
        value: "1000"
      # Gemini 3 per the hackathon brief (agent + drafting). The V9 judge is
      # hard-coded to 2.5-flash so eval scores stay comparable across model
      # swaps; the loop's lift on 2.5 drafting (+0.81) is documented in
      # DEVPOST as a finding.
      - key: GEMINI_DRAFT_MODEL
        value: "gemini-3.5-flash"
      - key: GOOGLE_API_KEY
        sync: false
      - key: SERPAPI_API_KEY
        sync: false
      # Contact discovery makes several provider queries per new plan. These
      # UTC-window caps keep any explicitly opened controlled beta inside a bounded budget;
      # idempotent retries and active-plan reuse do not consume another slot.
      - key: JOB_HUNT_CONTACT_PLAN_OWNER_DAILY_LIMIT
        value: "2"
      - key: JOB_HUNT_CONTACT_PLAN_GLOBAL_DAILY_LIMIT
        value: "5"
      - key: JOB_HUNT_CONTACT_PLAN_GLOBAL_MONTHLY_LIMIT
        value: "80"
      - key: PHOENIX_API_KEY
        sync: false
      - key: PHOENIX_COLLECTOR_ENDPOINT
        sync: false
      # Configure the exact HTTPS production Vercel origin, without a trailing
      # slash. Startup rejects wildcards and localhost entries.
      - key: ALLOWED_ORIGINS
        sync: false
