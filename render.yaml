services:
  - type: web
    name: job-hunt-agent
    runtime: docker
    plan: free
    region: singapore
    # Web traffic is safe once Postgres is reachable and migrated. Full `/ready`
    # separately reports whether provider jobs also have a compatible worker.
    healthCheckPath: /web-ready
    # Do not deploy a commit until the linked branch's required CI checks pass.
    autoDeployTrigger: checksPass
    envVars:
      - key: ENVIRONMENT
        value: production
      # Production defaults to the authenticated private workspace. This
      # blueprint intentionally will not start without managed Postgres and an
      # owner-token hash; the old public paid-provider endpoint is unsafe.
      - key: ENABLE_PRACTICAL_MODE
        value: "1"
      # Compatibility history remains readable/deletable during migration,
      # but production cannot create or mutate legacy hunts.
      - key: LEGACY_HUNT_API_MODE
        value: read_only
      - key: LEGACY_HUNT_API_SUNSET
        value: "Thu, 31 Dec 2026 23:59:59 GMT"
      - key: DATABASE_URL
        sync: false
      - key: JOB_HUNT_OWNER_ID
        value: owner
      - key: JOB_HUNT_OWNER_TOKEN_HASH
        sync: false
      - key: JOB_HUNT_PRIVACY_RECEIPT_SECRET
        sync: false
      - key: ENABLE_TRACING
        value: "1"
      - key: ENABLE_TRACE_DRAFT_CONTENT
        value: "0"
      # Production resume processing must use paid Gemini API quota. Set this
      # manually to 1 only after confirming the configured Google API key is
      # on paid Gemini quota; abuse-monitoring retention still applies.
      - key: GEMINI_PAID_SERVICE_ACK
        sync: false
      # Health checks and normal traffic trigger expired-data cleanup at this
      # interval so long-lived services do not retain runs indefinitely.
      - key: RETENTION_CLEANUP_INTERVAL_SECONDS
        value: "3600"
      # Comma-separated key-id:Fernet-key entries. The first key encrypts new
      # requests, results, and outcomes; keep older keys during rotation.
      - key: JOB_HUNT_DATA_KEYS
        sync: false
      - key: PHOENIX_QUERY_TRANSPORT
        value: rest
      - key: PHOENIX_QUERY_LOOKBACK_HOURS
        value: "720"
      # Phoenix Cloud regularly exceeds the 1.5s default on long lookbacks,
      # and one timeout disables self-RAG for the whole run (exemplar cache).
      - key: PHOENIX_QUERY_TIMEOUT_S
        value: "15"
      # Retrieval reads newest spans first; a small window lets fresh runs
      # bury the curated seed exemplars. 1000 x 3 pages keeps ~3000 spans
      # (~100 runs) in reach.
      - key: PHOENIX_QUERY_SPAN_LIMIT
        value: "1000"
      # Gemini 3 per the hackathon brief (agent + drafting). The V9 judge is
      # hard-coded to 2.5-flash so eval scores stay comparable across model
      # swaps; the loop's lift on 2.5 drafting (+0.81) is documented in
      # DEVPOST as a finding.
      - key: GEMINI_DRAFT_MODEL
        value: "gemini-3.5-flash"
      - key: GOOGLE_API_KEY
        sync: false
      - key: SERPAPI_API_KEY
        sync: false
      - key: PHOENIX_API_KEY
        sync: false
      - key: PHOENIX_COLLECTOR_ENDPOINT
        sync: false
      # Configure the exact HTTPS production Vercel origin, without a trailing
      # slash. Startup rejects wildcards and localhost entries.
      - key: ALLOWED_ORIGINS
        sync: false
