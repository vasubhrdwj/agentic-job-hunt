services:
  - type: web
    name: job-hunt-agent
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: ENABLE_TRACING
        value: "1"
      # Render free tier has no persistent disk: this file is wiped on every
      # redeploy, restart, or idle spin-down. The /health keep-alive ping
      # prevents the spin-down case; freeze deploys after the demo recording.
      - key: JOB_HUNT_DB_PATH
        value: /tmp/outcomes.db
      - key: PHOENIX_QUERY_TRANSPORT
        value: rest
      - key: PHOENIX_QUERY_LOOKBACK_HOURS
        value: "720"
      # Phoenix Cloud regularly exceeds the 1.5s default on long lookbacks,
      # and one timeout disables self-RAG for the whole run (exemplar cache).
      - key: PHOENIX_QUERY_TIMEOUT_S
        value: "15"
      # Retrieval reads newest spans first; a small window lets fresh runs
      # bury the curated seed exemplars. 1000 x 3 pages keeps ~3000 spans
      # (~100 runs) in reach.
      - key: PHOENIX_QUERY_SPAN_LIMIT
        value: "1000"
      # Gemini 3 per the hackathon brief (agent + drafting). The V9 judge is
      # hard-coded to 2.5-flash so eval scores stay comparable across model
      # swaps; the loop's lift on 2.5 drafting (+0.81) is documented in
      # DEVPOST as a finding.
      - key: GEMINI_DRAFT_MODEL
        value: "gemini-3.5-flash"
      - key: GOOGLE_API_KEY
        sync: false
      - key: SERPAPI_API_KEY
        sync: false
      - key: PHOENIX_API_KEY
        sync: false
      - key: PHOENIX_COLLECTOR_ENDPOINT
        sync: false
      # Must be the exact production Vercel URL; startup rejects '*' and
      # localhost when ENVIRONMENT=production.
      - key: ALLOWED_ORIGINS
        sync: false
