app = "job-hunt-agent"
primary_region = "bom"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  ENVIRONMENT = "production"
  ENABLE_TRACING = "1"
  JOB_HUNT_DB_PATH = "/data/outcomes.db"
  PHOENIX_QUERY_LOOKBACK_HOURS = "720"
  PHOENIX_QUERY_TRANSPORT = "rest"

[[mounts]]
  source = "data"
  destination = "/data"

[[services]]
  protocol = "tcp"
  internal_port = 8000

  [[services.ports]]
    port = 80
    handlers = ["http"]

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [[services.http_checks]]
    interval = "30s"
    timeout = "5s"
    method = "get"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
