<meta charset="utf-8" />
<title>Job Hunt Signal — stage</title>
<style>
  :root { --ink:#07090f; --white:#f6f7fc; --muted:#a6acbf; --accent:#7077ff; --mint:#59e2c2; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1920px; height:1080px; overflow:hidden; }
  body { position:relative; font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif;
    color:var(--white); -webkit-font-smoothing:antialiased; }

  /* gradient background (matches the intro/outro aurora) */
  #bg { position:absolute; inset:0; background:var(--ink); overflow:hidden; }
  .blob { position:absolute; border-radius:50%; filter:blur(90px); }
  #b1 { width:1200px; height:1200px; left:820px; top:-460px;
        background:radial-gradient(circle,rgba(112,119,255,0.5),rgba(112,119,255,0) 62%); }
  #b2 { width:1150px; height:1150px; left:-360px; top:500px;
        background:radial-gradient(circle,rgba(89,226,194,0.30),rgba(89,226,194,0) 60%); }
  #b3 { width:900px; height:900px; left:650px; top:600px;
        background:radial-gradient(circle,rgba(138,120,255,0.26),rgba(138,120,255,0) 60%); }
  #grid { position:absolute; inset:-10%;
    background-image:linear-gradient(rgba(255,255,255,0.04) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(255,255,255,0.04) 1px,transparent 1px);
    background-size:132px 132px; opacity:0.5; }
  #vignette { position:absolute; inset:0;
    background:radial-gradient(120% 92% at 50% 44%,rgba(0,0,0,0) 44%,rgba(0,0,0,0.55) 100%); }

  /* panel geometry: 1720x784 preserves the 1918x874 footage aspect */
  #panelShadow { position:absolute; left:100px; top:238px; width:1720px; height:784px;
    border-radius:26px; box-shadow:0 40px 90px rgba(0,0,0,0.55); }
  #panelBorder { position:absolute; left:100px; top:238px; width:1720px; height:784px;
    border-radius:26px; border:1.5px solid rgba(255,255,255,0.14);
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.08); }
  #maskRect { position:absolute; left:100px; top:238px; width:1720px; height:784px;
    border-radius:26px; background:#ffffff; }

  .brandbar { position:absolute; left:100px; top:64px; display:flex; align-items:center; gap:14px; }
  .brandbar .dot { width:20px; height:20px; border-radius:50%;
    background:radial-gradient(circle at 34% 30%,#b9f7e6,var(--mint)); box-shadow:0 0 20px rgba(89,226,194,0.5); }
  .brandbar .wm { font-weight:700; letter-spacing:0.22em; font-size:20px; color:rgba(246,247,252,0.9); }
  .live { position:absolute; right:100px; top:68px; display:flex; align-items:center; gap:12px;
    font-weight:700; letter-spacing:0.2em; font-size:15px; color:var(--muted); }
  .live .rec { width:9px; height:9px; border-radius:50%; background:#ff6b6b; box-shadow:0 0 14px rgba(255,107,107,0.8); }

  /* caption band above the panel */
  #cap { position:absolute; left:100px; top:132px; }
  #cap .eye { font-weight:700; letter-spacing:0.32em; font-size:19px; color:var(--mint); text-transform:uppercase; }
  #cap .ttl { font-weight:700; letter-spacing:-0.015em; font-size:44px; color:var(--white); margin-top:8px;
    display:flex; align-items:center; gap:24px; }
  #cap .ttl .line { width:120px; height:4px; border-radius:2px; background:var(--accent); opacity:0.85; }
</style>

<div id="bg">
  <div class="blob" id="b1"></div>
  <div class="blob" id="b2"></div>
  <div class="blob" id="b3"></div>
  <div id="grid"></div>
  <div id="vignette"></div>
</div>
<div id="panelShadow"></div>
<div id="maskRect"></div>
<div id="panelBorder"></div>
<div class="brandbar"><span class="dot"></span><span class="wm">JOB HUNT SIGNAL</span></div>
<div class="live"><span class="rec"></span> REAL PRODUCT · UNEDITED CAPTURE</div>
<div id="cap"><div class="eye"></div><div class="ttl"><span class="txt"></span><span class="line"></span></div></div>

<script>
// Walkthrough-act chrome. Rendered in modes so the orchestrator can composite
// the live footage cleanly:
//   ?mode=bg      -> opaque gradient base (matches the intro aurora)
//   ?mode=frame   -> transparent: panel border + brand + REC label (no caption)
//   ?mode=mask    -> white rounded rect on black (luma alpha for the footage corners)
//   ?caption=N    -> transparent: caption band N only
const CAPTIONS = [
  ["ONE PRIVATE PROFILE",       "Upload once. Reuse the proof."],
  ["TODAY",                     "A ranked queue, not another feed."],
  ["A REAL AMAZON OPENING",     "Fit is explained, not guessed."],
  ["EVIDENCE BEFORE CLAIMS",    "No proof? Materials stay locked."],
  ["FIVE SOURCE-BACKED PATHS",  "Not one fragile referral."],
  ["GROUNDED, MANUAL OUTREACH", "A distinct note per person — you send it."],
  ["THE LOOP CLOSES",           "Follow-ups stay dated. Progress stays honest."],
];
window.CAPTIONS = CAPTIONS;

const p = new URLSearchParams(location.search);
const mode = p.get("mode");
const capIndex = p.get("caption");
const $ = (s) => document.querySelector(s);

function show(el, on) { el.style.display = on ? "" : "none"; }

const bg = $("#bg"), maskRect = $("#maskRect"), border = $("#panelBorder"),
      shadow = $("#panelShadow"), brand = $(".brandbar"), live = $(".live"), cap = $("#cap");

// default: hide everything, then enable per mode
[bg, maskRect, border, shadow, brand, live, cap].forEach((e) => show(e, false));

if (mode === "bg") {
  show(bg, true); show(shadow, true);
} else if (mode === "mask") {
  document.body.style.background = "#000";
  show(maskRect, true);
} else if (mode === "frame") {
  show(border, true); show(brand, true); show(live, true);
} else if (capIndex !== null) {
  const [eye, ttl] = CAPTIONS[Number(capIndex)];
  cap.querySelector(".eye").textContent = eye;
  cap.querySelector(".txt").textContent = ttl;
  show(cap, true);
}
window.__ready = true;
</script>
