<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; }
    body {
      width: 1920px; height: 1080px; margin: 0; overflow: hidden;
      color: #f5f7fb; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 78% 18%, rgba(99,102,241,.38), transparent 26%),
        radial-gradient(circle at 17% 82%, rgba(20,184,166,.23), transparent 28%),
        linear-gradient(145deg, #080b12 0%, #101522 55%, #090c13 100%);
    }
    .noise {
      position: absolute; inset: 0; opacity: .22;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.86' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.2'/%3E%3C/svg%3E");
      mix-blend-mode: soft-light;
    }
    .wrap { position: absolute; inset: 0; padding: 104px 128px; display: flex; flex-direction: column; justify-content: center; }
    .logo { display: flex; align-items: center; gap: 18px; color: #b8c1d1; font-size: 19px; font-weight: 600; letter-spacing: .04em; }
    .mark {
      width: 48px; height: 48px; border-radius: 15px;
      background: linear-gradient(145deg, #7180ff, #a365ff);
      box-shadow: 0 0 48px rgba(113,128,255,.5);
      position: relative;
    }
    .mark:after { content: ""; position: absolute; inset: 13px; border: 3px solid white; border-radius: 50%; border-right-color: transparent; transform: rotate(-35deg); }
    h1 { font-size: 106px; max-width: 1340px; line-height: .98; letter-spacing: -.065em; margin: 58px 0 28px; }
    h2 { font-size: 86px; max-width: 1400px; line-height: 1.02; letter-spacing: -.055em; margin: 52px 0 25px; }
    .gradient { background: linear-gradient(90deg, #f7f8ff, #b7c0ff 44%, #7cebd5); -webkit-background-clip: text; color: transparent; }
    .sub { color: #a7b0c0; font-size: 31px; line-height: 1.45; max-width: 1000px; }
    .rule { width: 78px; height: 5px; border-radius: 99px; background: #7c8cff; margin: 36px 0; box-shadow: 0 0 24px rgba(124,140,255,.55); }
    .pill { margin-top: 52px; display: inline-flex; align-items: center; gap: 10px; align-self: flex-start; border: 1px solid rgba(135,150,182,.28); border-radius: 999px; padding: 13px 19px; color: #b5c0d2; background: rgba(255,255,255,.035); font-size: 15px; }
    .dot { width: 8px; height: 8px; background: #41dbba; border-radius: 50%; box-shadow: 0 0 16px rgba(65,219,186,.8); }
    .metric-row { display: flex; gap: 20px; margin-top: 55px; }
    .metric { width: 255px; padding: 22px; border: 1px solid rgba(135,150,182,.24); border-radius: 18px; background: rgba(255,255,255,.04); }
    .metric b { font-size: 38px; display: block; color: #f4f6ff; }
    .metric span { display: block; color: #93a0b5; font-size: 13px; margin-top: 5px; }
    .corner { position: absolute; right: 70px; bottom: 58px; font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; color: #718096; }
  </style>
</head>
<body>
  <div class="noise"></div>
  <div class="wrap" id="card"></div>
  <div class="corner">GEMINI × ARIZE PHOENIX</div>
  <script>
    const card = new URLSearchParams(location.search).get("card") || "title";
    const content = {
      title: `
        <div class="logo"><div class="mark"></div>JOB HUNT SIGNAL</div>
        <h1><span class="gradient">Outreach that learns from its own traces.</span></h1>
        <div class="rule"></div>
        <div class="sub">An evidence-based job hunt agent that finds roles, referral targets, and messages worth replying to.</div>
        <div class="pill"><i class="dot"></i> Real roles · Real profiles · Measurable improvement</div>`,
      loop: `
        <div class="logo"><div class="mark"></div>THE SELF-IMPROVEMENT LOOP</div>
        <h2><span class="gradient">Does reading its own traces make the agent better?</span></h2>
        <div class="metric-row">
          <div class="metric"><b>4.25</b><span>baseline · retrieval off</span></div>
          <div class="metric"><b>4.64</b><span>self-RAG · retrieval on</span></div>
          <div class="metric"><b>+0.39</b><span>measured quality lift</span></div>
        </div>`,
      close: `
        <div class="logo"><div class="mark"></div>JOB HUNT SIGNAL</div>
        <h1><span class="gradient">Real roles. Better outreach. A learning loop you can measure.</span></h1>
        <div class="rule"></div>
        <div class="sub">Gemini for the agent. Phoenix for the memory.</div>
        <div class="pill"><i class="dot"></i> Live app and code in the description</div>`
    };
    document.querySelector("#card").innerHTML = content[card] || content.title;
  </script>
</body>
</html>
